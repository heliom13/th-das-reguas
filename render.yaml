services:
  - type: web
    name: th-das-reguas
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /saude
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: PAINEL_SENHA
        sync: false
      - key: SEGREDO_SESSAO
        generateValue: true

services:
  - type: web
    name: th-das-reguas-pedidos
    runtime: node
    plan: free
    region: virginia
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /saude
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: MANTER_ACORDADO
        value: "1"
      # Supabase (plano grátis, us-east-1): endereço do "Session pooler", porta 5432
      - key: DATABASE_URL
        sync: false
      - key: PAINEL_SENHA
        sync: false
      - key: SEGREDO_SESSAO
        generateValue: true

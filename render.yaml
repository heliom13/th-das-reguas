databases:
  - name: th-das-reguas-db
    databaseName: thdasreguas
    user: thdasreguas
    plan: free
    region: virginia
    postgresMajorVersion: "16"

services:
  - type: web
    name: th-das-reguas
    runtime: node
    plan: free
    region: virginia
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /saude
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: MANTER_ACORDADO
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: th-das-reguas-db
          property: connectionString
      - key: PAINEL_SENHA
        sync: false
      - key: SEGREDO_SESSAO
        generateValue: true
